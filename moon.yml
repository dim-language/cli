$schema: '../../.moon/cache/schemas/project.json'
language: 'rust'
layer: 'application'
stack: 'backend'
dependsOn:
  - 'dim'
tasks:
  build:
    command: 'cargo build --release -p dim-cli'
    inputs:
      - '@group(sources)'
    outputs:
      - '/target/release/dim'
  smoke:
    # Jalankan CLI terhadap contoh di root repo: model utama dan turunannya.
    script: 'cargo run -q -p dim-cli -- check ../../docs/examples/shop/main.dim && cargo run -q -p dim-cli -- check ../../docs/examples/shop/to-be.dim'
    inputs:
      - '@group(sources)'
      - '/docs/examples/**/*'
